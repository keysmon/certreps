name: CI

# Free-tier discipline (private repo, 2000 Actions minutes/month, no paid runners, no card):
# one ubuntu-latest job chain (never split into parallel jobs - that multiplies minutes for
# a repo this size), cancel-in-progress on superseding pushes, and a cached Playwright
# browser install. No secrets anywhere here - the app builds and the e2e suite runs
# entirely env-less (NEXT_PUBLIC_SUPABASE_* empty), exercising anonymous flows only.
on:
  push:
    branches:
      - main
      - "v1*"
  pull_request:
    branches:
      - main
      - "v1*"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Validate question banks (schema only)
        run: python3 pipeline/validate_bank.py

      - name: Build (env-less)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
